.btn {

  border-radius: 6px;
  background: #3498db;
  color: white;
  font-size: 14px;

}

.btn:hover {

}

.btn-success {
  background: #2ecc71;
}

.btn-success:hover {
  background: #27ae60;
}

.btn-danger {

}

.btn-danger:hover {

}
